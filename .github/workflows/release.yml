name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.2.3"
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          SHA=$(gh api "repos/$REPO/commits/main" --jq .sha)
          conclusion=$(gh run list --repo "$REPO" --workflow ci.yml --commit "$SHA" --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          if [ "$conclusion" -lt 1 ]; then
            echo "ci.yml has not succeeded on $SHA" >&2
            exit 1
          fi
          gh release create "v$VERSION" --repo "$REPO" --target "$SHA" --generate-notes
          if [[ "$VERSION" == 1.* ]]; then
            if gh api "repos/$REPO/git/ref/tags/v1" >/dev/null 2>&1; then
              gh api -X PATCH "repos/$REPO/git/refs/tags/v1" -f sha="$SHA" -F force=true
            else
              gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/v1" -f sha="$SHA"
            fi
          else
            echo "version $VERSION is not 1.x; not moving v1"
          fi
